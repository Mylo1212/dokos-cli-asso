name: CI

on:
  push:
  pull_request:
  schedule:
    # Audit hebdomadaire des dépendances, lundi 6 h UTC.
    - cron: "0 6 * * 1"

jobs:
  # Bibliothèques et ligne de commande, sans frontend : tout le workspace sauf
  # l'appli (job « app »).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: [stable, "1.90"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude dokos-assistant --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --exclude dokos-assistant --all-features --locked

  # Interface : types, tests Vitest, mise en forme.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check "src/**/*.ts" index.html
      - run: npm run verifier
      - run: npm test
      - run: npm run build

  # Appli Tauri : frontend construit puis crate dokos-assistant.
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run build
      - run: cargo clippy -p dokos-assistant --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test -p dokos-assistant --locked
        working-directory: src-tauri

  # Vulnérabilités connues dans les dépendances Rust et npm.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri
      - run: npm ci
      - run: npm audit --audit-level=high
