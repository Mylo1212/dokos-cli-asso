[package]
name = "conformite"
description = "Vérification des contrats de travail : mentions obligatoires, gabarits Jinja, cohérence des données"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["dokos"]
# Lecture des contrats et formats d'impression dans Dokos. Sans elle, le crate est sans réseau.
dokos = ["dep:dokos-core"]

[dependencies]
dokos-core = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
dokos-core = { workspace = true, features = ["faux"] }
serde_json.workspace = true

[lints]
workspace = true
